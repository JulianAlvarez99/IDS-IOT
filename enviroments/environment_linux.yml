# =============================================================================
# Entorno Conda: ids-iot-train-linux (Servidor HPC - Linux Cinnamon)
# Proyecto: Módulo de Detección para IDS Pasivo
#
# Fix: Versiones estrictamente ancladas para HLS4ML 0.7.1 y Protobuf 3.20.x
# =============================================================================

name: ids-iot-train-linux

channels:
  - conda-forge
  - defaults

dependencies:
  # ── Core ────────────────────────────────────────────────────────────────────
  - python=3.10
  - pip

  # ── Entorno Jupyter y Manipulación ──────────────────────────────────────────
  - ipykernel
  - jupyterlab>=4.0
  - numpy<1.24.0    
  - pandas
  - pyarrow
  - tqdm

  # ── ML clásico y Explicabilidad ─────────────────────────────────────────────
  - scikit-learn
  - joblib
  - xgboost
  - shap
  - matplotlib
  - seaborn
  - pydot          
  - graphviz       

  # ── Instalados vía pip ──────────────────────────────────────────────────────
  - pip:
    # ── Parche Crítico de Compatibilidad ──────────────────────────────────────
    - protobuf==3.20.3              # CRÍTICO: Evita TypeError de Descriptors en TF < 2.13

    # TensorFlow 2.12 nativo (incluye soporte de GPU CUDA 11.8 en Linux)
    - tensorflow==2.12.1

    # ── Módulo de Compresión y Hardware ───────────────────────────────────────
    - tensorflow-model-optimization==0.7.5 # Anclado a la era de TF 2.12
    - hls4ml==0.7.1                 # DOWNGRADE: Evita el error config_array_partition de Vitis 2022.2
    - qkeras==0.9.0                 # Fijado estrictamente según requerimiento

    # ── Generación de Datos y Balanceo ────────────────────────────────────────
    - ctgan==0.9.1                  # Anclado por estabilidad
    - imbalanced-learn==0.11.0      # Resuelve el error de Numpy!

    # ── NAS y Redes ───────────────────────────────────────────────────────────
    - keras-tuner==1.3.5            # Resuelve el error de tf-keras! Evita Keras 3
    - visualkeras

    # ── Utilidades ────────────────────────────────────────────────────────────
    - kagglehub
    - gputil
    - black
    - isort